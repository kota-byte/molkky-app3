<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;font-family:sans-serif;}
html,body{background:transparent;overflow:hidden;}

/* ネイティブのselect/inputは一切使わない（iOS Safariでiframe内の
   ネイティブフォーム部品がキーボード表示になってしまう既知の不具合を
   避けるため）。タップで開くリストを自前のdiv/buttonだけで実装する */

#trigger{
  width:100%;height:48px;
  font-size:16px;font-weight:700;
  color:#FF6B35;background:#FFFFFF;
  border:2px solid #FF6B35;border-radius:14px;
  padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
}
#trigger .arrow{
  font-size:12px;color:#FF6B35;
  transition:transform .15s;
}
#trigger.open .arrow{transform:rotate(180deg);}

#list{
  display:none;
  margin-top:6px;
  border:2px solid #FF6B35;border-radius:14px;
  background:#FFFFFF;
  overflow-y:auto;
  max-height:220px;
}
#list.open{display:block;}

.opt{
  padding:11px 14px;
  font-size:15px;font-weight:600;color:#333;
  border-bottom:1px solid #FFE4B5;
  cursor:pointer;
}
.opt:last-child{border-bottom:none;}
.opt.selected{color:#FF6B35;background:#FFF1E6;}
.opt:active{background:#FFE4B5;}
</style>
</head>
<body>
<div id="trigger"><span id="trigger-label"></span><span class="arrow">▾</span></div>
<div id="list"></div>
<script>
function sendToStreamlit(type, data) {
  const outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function setFrameHeight(height) {
  sendToStreamlit("streamlit:setFrameHeight", { height: height });
}
function setComponentValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}

const trigger = document.getElementById('trigger');
const triggerLabel = document.getElementById('trigger-label');
const list = document.getElementById('list');

const COLLAPSED_HEIGHT = 52;
let currentOptions = [];
let currentValue = null;
let isOpen = false;

function expandedHeight() {
  const rowHeight = 45; // .optのだいたいの高さ
  const visibleRows = Math.min(currentOptions.length, 5);
  const listHeight = Math.min(visibleRows * rowHeight, 220);
  return COLLAPSED_HEIGHT + 6 + listHeight;
}

function setOpen(open) {
  isOpen = open;
  trigger.classList.toggle('open', open);
  list.classList.toggle('open', open);
  setFrameHeight(open ? expandedHeight() : COLLAPSED_HEIGHT);
}

trigger.addEventListener('click', () => setOpen(!isOpen));

function renderList() {
  list.innerHTML = '';
  currentOptions.forEach(opt => {
    const el = document.createElement('div');
    el.className = 'opt' + (opt === currentValue ? ' selected' : '');
    el.textContent = opt;
    el.addEventListener('click', () => {
      currentValue = opt;
      triggerLabel.textContent = opt;
      setOpen(false);
      setComponentValue(opt);
    });
    list.appendChild(el);
  });
}

function onRender(event) {
  const args = event.data.args;
  const options = args.options || [];
  const value = args.value;

  const optionsChanged = currentOptions.length !== options.length ||
    currentOptions.some((v, i) => v !== options[i]);
  currentOptions = options;

  if (currentValue !== value || optionsChanged) {
    currentValue = value;
    triggerLabel.textContent = value;
    renderList();
  }
  setFrameHeight(isOpen ? expandedHeight() : COLLAPSED_HEIGHT);
}

window.addEventListener('message', event => {
  if (event.data.type === 'streamlit:render') {
    onRender(event);
  }
});

sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
setFrameHeight(COLLAPSED_HEIGHT);
</script>
</body>
</html>
