<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#f8fafc;touch-action:none;font-family:sans-serif;}

/* ── コートSVG：画面全体に広げる ── */
#court-svg{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
}

/* ── ピン層（絶対座標で浮遊） ── */
#pin-layer{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:50;
}
#pin-layer .court-pin{pointer-events:auto;}

/* ── コート上ピン ── */
.court-pin{
  position:absolute;
  font-size:14px;line-height:1;
  transform:translate(-50%,-50%);
  cursor:grab;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
  touch-action:none;
  z-index:50;
  will-change:transform;
  transition:text-shadow .1s;
}
.court-pin.dragging{
  text-shadow:0 4px 8px rgba(0,0,0,.55);
  z-index:200;
}

/* ── ドラッグ中の位置表示（吹き出し） ── */
#drag-tooltip{
  position:fixed;
  transform:translate(-50%,-100%);
  background:#1e293b;color:#fff;
  font-size:13px;font-weight:700;
  padding:5px 10px;border-radius:8px;
  white-space:nowrap;
  pointer-events:none;
  z-index:250;
  display:none;
  box-shadow:0 3px 10px rgba(0,0,0,.3);
}
#drag-tooltip::after{
  content:'';
  position:absolute;left:50%;top:100%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:#1e293b;
}
#drag-tooltip.visible{display:block;}

/* ── 上部バー ── */
#top-bar{
  position:fixed;top:0;left:0;right:0;height:48px;
  padding:0 14px;z-index:300;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(248,250,252,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid #e2e8f0;
}
#pin-count{font-size:13px;color:#64748b;}
#exit-btn{
  height:34px;padding:0 16px;border:none;border-radius:7px;
  background:#ef4444;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
}
#exit-btn:active{background:#dc2626;}

/* ── エッジタブ（右端中央） ── */
#palette-tab{
  position:fixed;right:0;top:50%;transform:translateY(-50%);
  width:30px;height:88px;
  background:#1e293b;border-radius:10px 0 0 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;z-index:310;
  box-shadow:-3px 0 10px rgba(0,0,0,.25);
  transition:background .15s,right .28s cubic-bezier(.4,0,.2,1);
}
#palette-tab:active{background:#0f172a;}
#palette-tab .arrow{
  width:0;height:0;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-right:7px solid #94a3b8;
  transition:transform .28s;
}
#palette-tab.open .arrow{transform:rotate(180deg);}
#palette-tab .tab-label{
  font-size:9px;color:#64748b;letter-spacing:.5px;writing-mode:vertical-rl;
  margin-top:4px;
}

/* ── スライドアウトパレット ── */
#palette{
  position:fixed;top:0;right:-220px;width:220px;height:100%;
  background:#1e293b;border-left:1.5px solid #334155;
  z-index:300;
  transition:right .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  padding-top:48px;
}
#palette.open{right:0;}
#palette.open ~ #palette-tab{right:220px;}

#palette-header{
  padding:12px 12px 8px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #334155;flex-shrink:0;
}
#palette-header span{font-size:12px;color:#94a3b8;letter-spacing:.5px;}
#palette-close{
  width:26px;height:26px;border:none;background:rgba(255,255,255,.07);
  border-radius:6px;color:#64748b;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

#palette-grid{
  flex:1;overflow-y:auto;padding:10px 8px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;
}

.pal-pin{
  aspect-ratio:1;
  background:rgba(255,255,255,.15);
  border:1.5px solid #64748b;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  font-size:28px;cursor:grab;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  touch-action:none;
  transition:background .15s,border-color .15s,opacity .15s;
}
.pal-pin .pal-label{font-size:10px;color:#94a3b8;}
.pal-pin:active{cursor:grabbing;background:rgba(255,255,255,.12);}
.pal-pin.on-court{
  background:rgba(239,68,68,.1);
  border-color:rgba(239,68,68,.5);
  opacity:.6;
}

#auto-arrange-btn{
  flex-shrink:0;
  margin:4px 8px 10px;
  height:40px;border:none;border-radius:8px;
  background:#f59e0b;color:#1e293b;
  font-size:13px;font-weight:700;cursor:pointer;
}
#auto-arrange-btn:active{background:#d97706;}

/* ── ズームコントロール（左下） ── */
#zoom-controls{
  position:fixed;left:14px;bottom:20px;z-index:290;
  display:flex;flex-direction:column;gap:7px;
}
#zoom-controls button{
  width:40px;height:40px;border:none;border-radius:50%;
  background:rgba(30,41,59,.85);color:#fff;
  font-size:20px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  cursor:pointer;
}
#zoom-controls button:active{background:#0f172a;}
#zoom-reset{font-size:14px !important;}
</style>
</head>
<body>

<!-- 上部バー -->
<div id="top-bar">
  <span id="pin-count">0 / 12 本配置</span>
  <button id="exit-btn">✕ 保存して終了</button>
</div>

<!-- ズームコントロール -->
<div id="zoom-controls">
  <button id="zoom-in">＋</button>
  <button id="zoom-out">－</button>
  <button id="zoom-reset">⟲</button>
</div>

<!-- コートSVG -->
<svg id="court-svg" viewBox="0 0 480 1080"
     preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="480" height="1080" fill="#f8fafc"/>
  <!-- コート本体 -->
  <rect x="60" y="40" width="360" height="1000"
        fill="rgba(34,197,94,.04)" stroke="#475569" stroke-width="3" rx="2"/>
  <!-- センターライン -->
  <line x1="240" y1="40" x2="240" y2="1040"
        stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="10,7"/>
  <!-- 投擲ライン 3.5m (svg_y=690) -->
  <line x1="60" y1="690" x2="420" y2="690"
        stroke="#f59e0b" stroke-width="2.5"/>
  <text x="240" y="676" text-anchor="middle"
        font-size="18" fill="#f59e0b" font-family="sans-serif">投擲ライン 3.5m</text>
  <!-- 距離目盛り（左端） -->
  <text x="48" y="1044" text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 0m</text>
  <text x="48" y="944"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 1m</text>
  <text x="48" y="844"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 2m</text>
  <text x="48" y="744"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 3m</text>
  <text x="48" y="644"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 4m</text>
  <text x="48" y="544"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 5m</text>
  <text x="48" y="444"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 6m</text>
  <text x="48" y="344"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 7m</text>
  <text x="48" y="244"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 8m</text>
  <text x="48" y="144"  text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif"> 9m</text>
  <text x="48" y="50"   text-anchor="end" font-size="16" fill="#94a3b8" font-family="sans-serif">10m</text>
  <!-- 目盛り横線（補助線） -->
  <line x1="58" y1="1040" x2="62" y2="1040" stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="940"  x2="62" y2="940"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="840"  x2="62" y2="840"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="740"  x2="62" y2="740"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="640"  x2="62" y2="640"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="540"  x2="62" y2="540"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="440"  x2="62" y2="440"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="340"  x2="62" y2="340"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="240"  x2="62" y2="240"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="140"  x2="62" y2="140"  stroke="#94a3b8" stroke-width="1"/>
  <line x1="58" y1="40"   x2="62" y2="40"   stroke="#94a3b8" stroke-width="1"/>
</svg>

<!-- ピン層 -->
<div id="pin-layer"></div>

<!-- ドラッグ中の位置表示 -->
<div id="drag-tooltip"></div>

<!-- エッジタブ -->
<div id="palette-tab" onclick="togglePalette()">
  <div class="arrow"></div>
  <span class="tab-label">ピン</span>
</div>

<!-- スライドアウトパレット -->
<div id="palette">
  <div id="palette-header">
    <span>スキットル一覧</span>
    <button id="palette-close" onclick="togglePalette()">✕</button>
  </div>
  <div id="palette-grid"></div>
  <button id="auto-arrange-btn">⚙️ 初期配置に並べる</button>
</div>

<script>
function sendToStreamlit(type, data) {
  const outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
function setFrameHeight(height) {
  sendToStreamlit("streamlit:setFrameHeight", { height: height });
}
function setComponentValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}

const EMOJI = {"1":"①","2":"②","3":"③","4":"④","5":"⑤","6":"⑥",
               "7":"⑦","8":"⑧","9":"⑨","10":"⑩","11":"⑪","12":"⑫"};

function mToSvg(mx, my) {
  return { x: 240 + mx * 90, y: 1040 - my * 100 };
}
function svgToM(sx, sy) {
  const rx_m = (sx - 240) / 90;
  const ry_m = (1040 - sy) / 100;
  return {
    x: Math.round(rx_m / 0.2) * 0.2,
    y: Math.round(ry_m / 0.2) * 0.2
  };
}

// viewBox(0 0 480 1080) + preserveAspectRatio="xMidYMid meet" を、ブラウザの
// getScreenCTM()に頼らず自前で計算する（CSSのtransformをgetScreenCTM()が
// 反映するかどうかはブラウザ実装によって差があり、反映されない環境では
// ズーム時にピンだけが取り残されて画面左上方向にズレて見えるバグになるため）。
const VB_W = 480, VB_H = 1080;
function getBaseFit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / VB_W, vh / VB_H);
  return { scale: s, offsetX: (vw - VB_W * s) / 2, offsetY: (vh - VB_H * s) / 2 };
}
function svgPtToScreen(svgX, svgY) {
  const base = getBaseFit();
  const baseX = base.offsetX + svgX * base.scale;
  const baseY = base.offsetY + svgY * base.scale;
  return { x: baseX * zoomScale + panX, y: baseY * zoomScale + panY };
}
function screenToSvgPt(cx, cy) {
  const base = getBaseFit();
  const baseX = (cx - panX) / zoomScale;
  const baseY = (cy - panY) / zoomScale;
  return { x: (baseX - base.offsetX) / base.scale, y: (baseY - base.offsetY) / base.scale };
}

const coords = {};
for (let n = 1; n <= 12; n++) coords[n] = null;

const pinLayer = document.getElementById('pin-layer');
const pinEls = {};
let initialized = false;

function createCourtPin(n) {
  if (pinEls[n]) return;
  const el = document.createElement('div');
  el.className = 'court-pin';
  el.id = 'pin-' + n;
  el.textContent = EMOJI[n];
  el.dataset.n = n;
  el.addEventListener('touchstart', onCourtTouchStart, {passive: false});
  el.addEventListener('mousedown',  onCourtMouseDown);
  pinLayer.appendChild(el);
  pinEls[n] = el;
  updatePinSize(n);
}

function destroyCourtPin(n) {
  if (pinEls[n]) { pinEls[n].remove(); delete pinEls[n]; }
}

// ズーム倍率に合わせてピンの表示サイズも拡大縮小する
// （ドラッグ中はさらに一回り大きく表示して掴んでいる感を出す）
const PIN_BASE_SIZE = 14, PIN_DRAG_SIZE = 18;
function updatePinSize(n) {
  const el = pinEls[n];
  if (!el) return;
  const base = el.classList.contains('dragging') ? PIN_DRAG_SIZE : PIN_BASE_SIZE;
  el.style.fontSize = (base * zoomScale) + 'px';
}
function updateAllPinSizes() {
  for (const n in pinEls) updatePinSize(n);
}

function positionCourtPin(n) {
  if (!coords[n] || !pinEls[n]) return;
  const sv = mToSvg(coords[n].x, coords[n].y);
  const sc = svgPtToScreen(sv.x, sv.y);
  pinEls[n].style.left = sc.x + 'px';
  pinEls[n].style.top  = sc.y + 'px';
}

window.addEventListener('resize', () => {
  for (let n = 1; n <= 12; n++) {
    if (coords[n]) positionCourtPin(n);
  }
});

// ── ズーム／パン ──
// コート(#court-svg)にCSSのtransformで拡大縮小・平行移動をかける。
// ピンの画面位置はgetScreenCTM()を使って都度算出しているため、
// この変換だけ入れれば既存のドラッグ／配置ロジックは変更不要で追従する。
const courtSvg = document.getElementById('court-svg');
let zoomScale = 1, panX = 0, panY = 0;
const MIN_ZOOM = 1, MAX_ZOOM = 6;

function clampScale(s) {
  return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, s));
}
function clampPan() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const contentW = vw * zoomScale, contentH = vh * zoomScale;
  panX = Math.min(0, Math.max(vw - contentW, panX));
  panY = Math.min(0, Math.max(vh - contentH, panY));
}
function applyTransform() {
  clampPan();
  courtSvg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
  for (let n = 1; n <= 12; n++) {
    if (coords[n]) positionCourtPin(n);
  }
  updateAllPinSizes();
}
function zoomAt(cx, cy, newScaleRaw) {
  const newScale = clampScale(newScaleRaw);
  const localX = (cx - panX) / zoomScale;
  const localY = (cy - panY) / zoomScale;
  panX = cx - localX * newScale;
  panY = cy - localY * newScale;
  zoomScale = newScale;
  applyTransform();
}
courtSvg.style.transformOrigin = '0 0';

document.getElementById('zoom-in').addEventListener('click', () => {
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, zoomScale * 1.4);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  zoomAt(window.innerWidth / 2, window.innerHeight / 2, zoomScale / 1.4);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoomScale = 1; panX = 0; panY = 0;
  applyTransform();
});

// マウスホイール（PCでの動作確認・操作用）
courtSvg.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAt(e.clientX, e.clientY, zoomScale * factor);
}, {passive: false});

// ピンチズーム（2本指）。ピンをドラッグ中は発動させない。
let pinch = null;
function touchDist(t0, t1) {
  return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
}
function touchMid(t0, t1) {
  return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
}
document.addEventListener('touchstart', e => {
  if (drag || e.touches.length !== 2) return;
  panDrag = null; // 1本指パン中に2本目が触れたらパンチズームに引き継ぐ
  e.preventDefault();
  const [t0, t1] = e.touches;
  pinch = {
    startDist: touchDist(t0, t1),
    startScale: zoomScale,
    startPanX: panX,
    startPanY: panY,
  };
}, {passive: false});
document.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const [t0, t1] = e.touches;
  const dist = touchDist(t0, t1);
  const mid = touchMid(t0, t1);
  const newScale = clampScale(pinch.startScale * (dist / pinch.startDist));
  const localX = (mid.x - pinch.startPanX) / pinch.startScale;
  const localY = (mid.y - pinch.startPanY) / pinch.startScale;
  panX = mid.x - localX * newScale;
  panY = mid.y - localY * newScale;
  zoomScale = newScale;
  applyTransform();
}, {passive: false});
document.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinch = null;
});

// 単指スワイプでパン（コート背景をドラッグして移動。ピンやピンチズームとは排他）
let panDrag = null;
courtSvg.style.cursor = 'grab';
function beginPan(cx, cy) {
  panDrag = { startX: cx, startY: cy, startPanX: panX, startPanY: panY };
}
function movePan(cx, cy) {
  if (!panDrag) return;
  panX = panDrag.startPanX + (cx - panDrag.startX);
  panY = panDrag.startPanY + (cy - panDrag.startY);
  applyTransform();
}
courtSvg.addEventListener('touchstart', e => {
  if (drag || pinch || e.touches.length !== 1) return;
  e.preventDefault();
  beginPan(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
courtSvg.addEventListener('mousedown', e => {
  if (drag) return;
  e.preventDefault();
  beginPan(e.clientX, e.clientY);
  courtSvg.style.cursor = 'grabbing';
});
document.addEventListener('touchmove', e => {
  if (panDrag && e.touches.length === 1) { e.preventDefault(); movePan(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: false});
document.addEventListener('mousemove', e => { if (panDrag) movePan(e.clientX, e.clientY); });
document.addEventListener('touchend', e => { if (e.touches.length === 0) panDrag = null; });
document.addEventListener('mouseup', () => { panDrag = null; courtSvg.style.cursor = 'grab'; });

let drag = null;
const dragTooltip = document.getElementById('drag-tooltip');

function formatPos(mPt) {
  const d = mPt.x < 0 ? `左${Math.abs(mPt.x).toFixed(2)}m`
          : mPt.x > 0 ? `右${mPt.x.toFixed(2)}m` : '中央';
  return `奥${mPt.y.toFixed(2)}m・${d}`;
}

function updateDragTooltip(cx, cy) {
  const svgPt = screenToSvgPt(cx, cy);
  const mPt = svgToM(svgPt.x, svgPt.y);
  dragTooltip.textContent = formatPos(mPt);
  dragTooltip.style.left = cx + 'px';
  dragTooltip.style.top = (cy - 28) + 'px';
}

function beginDragFromPalette(n, cx, cy) {
  if (coords[n]) {
    beginDragFromCourt(n, cx, cy);
    return;
  }
  createCourtPin(n);
  pinEls[n].style.left = cx + 'px';
  pinEls[n].style.top  = cy + 'px';
  pinEls[n].style.transform = 'translate(-50%,-50%)';
  pinEls[n].classList.add('dragging');
  updatePinSize(n);
  drag = {n, el: pinEls[n], startX: cx, startY: cy};
  dragTooltip.classList.add('visible');
  updateDragTooltip(cx, cy);
}

function onPalTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  beginDragFromPalette(+this.dataset.n, t.clientX, t.clientY);
}
function onPalMouseDown(e) {
  e.preventDefault();
  beginDragFromPalette(+this.dataset.n, e.clientX, e.clientY);
}

function beginDragFromCourt(n, cx, cy) {
  createCourtPin(n);
  pinEls[n].style.left = cx + 'px';
  pinEls[n].style.top  = cy + 'px';
  pinEls[n].style.transform = 'translate(-50%,-50%)';
  pinEls[n].classList.add('dragging');
  updatePinSize(n);
  drag = {n, el: pinEls[n], startX: cx, startY: cy};
  dragTooltip.classList.add('visible');
  updateDragTooltip(cx, cy);
}

function onCourtTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  beginDragFromCourt(+this.dataset.n, t.clientX, t.clientY);
}
function onCourtMouseDown(e) {
  e.preventDefault();
  beginDragFromCourt(+this.dataset.n, e.clientX, e.clientY);
}

function onMove(cx, cy) {
  if (!drag) return;
  const dx = cx - drag.startX;
  const dy = cy - drag.startY;
  drag.el.style.transform = 'translate(-50%,-50%) translate3d(' + dx + 'px,' + dy + 'px,0)';
  updateDragTooltip(cx, cy);
}
document.addEventListener('touchmove', e => {
  if (drag) { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: false});
document.addEventListener('mousemove', e => { if (drag) onMove(e.clientX, e.clientY); });

function onEnd(cx, cy) {
  if (!drag) return;
  const {n, el} = drag;
  drag = null;
  el.classList.remove('dragging');
  el.style.transform = 'translate(-50%,-50%)';
  updatePinSize(n);
  dragTooltip.classList.remove('visible');

  const svgPt = screenToSvgPt(cx, cy);
  const mPt   = svgToM(svgPt.x, svgPt.y);

  const inCourt = mPt.x >= -2 && mPt.x <= 2 && mPt.y > 0 && mPt.y <= 10;
  const pal = document.getElementById('palette');
  const paletteOpen = pal.classList.contains('open');
  const inPaletteArea = paletteOpen && cx > window.innerWidth - 230;

  if (!inCourt || inPaletteArea) {
    coords[n] = null;
    destroyCourtPin(n);
    document.getElementById('pal-' + n).classList.remove('on-court');
  } else {
    coords[n] = mPt;
    const sv = mToSvg(mPt.x, mPt.y);
    const sc = svgPtToScreen(sv.x, sv.y);
    el.style.left = sc.x + 'px';
    el.style.top  = sc.y + 'px';
    document.getElementById('pal-' + n).classList.add('on-court');
  }
  updateCount();
}

document.addEventListener('touchend',
  e => { if (drag) onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });
document.addEventListener('mouseup',
  e => { if (drag) onEnd(e.clientX, e.clientY); });

let paletteOpen = false;
function togglePalette() {
  paletteOpen = !paletteOpen;
  document.getElementById('palette').classList.toggle('open', paletteOpen);
  document.getElementById('palette-tab').classList.toggle('open', paletteOpen);
}

function updateCount() {
  const cnt = Object.values(coords).filter(Boolean).length;
  document.getElementById('pin-count').textContent = cnt + ' / 12 本配置';
}

// 公式の初期配置：投擲ラインから3.5mの位置を手前の列として、
// 手前から奥へ 1,2 / 3,10,4 / 5,11,12,6 / 7,9,8 の4列に密着させて並べる
// （通常モードの小さいコートがピクセル単位で座標を扱っており、0.2m刻み以外の
// 　値は全画面コートを出た後の再描画で丸められてしまうため、必ず0.2m刻みで指定する）
const INITIAL_LAYOUT = {
  1: {x: -0.2, y: 3.6}, 2: {x: 0.2, y: 3.6},
  3: {x: -0.4, y: 3.8}, 10: {x: 0, y: 3.8}, 4: {x: 0.4, y: 3.8},
  5: {x: -0.6, y: 4.0}, 11: {x: -0.2, y: 4.0}, 12: {x: 0.2, y: 4.0}, 6: {x: 0.6, y: 4.0},
  7: {x: -0.4, y: 4.2}, 9: {x: 0, y: 4.2}, 8: {x: 0.4, y: 4.2},
};

function autoArrangeInitialLayout() {
  for (let n = 1; n <= 12; n++) {
    const pos = INITIAL_LAYOUT[n];
    coords[n] = {x: pos.x, y: pos.y};
    createCourtPin(n);
    positionCourtPin(n);
    const pal = document.getElementById('pal-' + n);
    if (pal) pal.classList.add('on-court');
  }
  updateCount();
}
document.getElementById('auto-arrange-btn').addEventListener('click', autoArrangeInitialLayout);

document.getElementById('exit-btn').addEventListener('click', () => {
  const result = [];
  for (let n = 1; n <= 12; n++) {
    if (coords[n]) result.push({n, x: coords[n].x, y: coords[n].y});
  }
  setComponentValue(result);
});

function onRender(event) {
  if (initialized) return;
  initialized = true;

  const args = event.data.args;
  const initData = args.coords || [];
  initData.forEach(d => { coords[d.n] = {x: d.x, y: d.y}; });

  const grid = document.getElementById('palette-grid');
  for (let n = 1; n <= 12; n++) {
    const el = document.createElement('div');
    el.className = 'pal-pin' + (coords[n] ? ' on-court' : '');
    el.id = 'pal-' + n;
    el.innerHTML = `<span>${EMOJI[n]}</span>`;
    el.dataset.n = n;
    el.addEventListener('touchstart', onPalTouchStart, {passive: false});
    el.addEventListener('mousedown',  onPalMouseDown);
    grid.appendChild(el);
  }

  for (let n = 1; n <= 12; n++) {
    if (coords[n]) {
      createCourtPin(n);
      positionCourtPin(n);
    }
  }
  updateCount();
  setFrameHeight(900);
}

window.addEventListener('message', event => {
  if (event.data.type === 'streamlit:render') {
    onRender(event);
  }
});

sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
setFrameHeight(900);
</script>
</body>
</html>
